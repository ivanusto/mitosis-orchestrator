[agy]
verified = "1.5.7"
verified_on = "2026-11-13"
method = "headless /orchestrate runs with gemini-4-hydrogen-high, gemini-pro-orchestrator and gemini-pro-orchestrator-argon as primary"
method_zh = "以 gemini-4-hydrogen-high、gemini-pro-orchestrator 與 gemini-pro-orchestrator-argon 為主核做 headless /orchestrate 實跑"
fixtures = "1.5.7"
note = "Gemini 4 Hydrogen (`gemini-4-hydrogen-low|medium|high|xhigh`) is a frontier primary at High and XHigh; Low and Medium are warned about. Orchestrator (Carbon) (`gemini-pro-orchestrator`) and Orchestrator (Argon) (`gemini-pro-orchestrator-argon`) are accepted; they already split planning and execution internally, so subagent dispatch stacks on top. After `exit_plan_mode`, Orchestrator (Carbon) hands execution to an internal executor that hook payloads report as `gemini-flash-worker-agy`, which is accepted without the non-frontier warning; Orchestrator (Argon) kept its own id in the verified run. The `flash` and `flash_lite` subagent tiers are resolved server side and neither the CLI log nor hook payloads show the concrete model, so whether `flash` now means Hydrogen is unverified. Gemini 4 Carbon is listed by `agy models` only under ADC sign-in. agy 1.5.x has no list, grep, glob or find tool: the scout receives only `read_file` and `send_message`, so it reads named paths and reports BLOCKED when a search is needed. Print mode soft-denies a subagent's file write outside a real `/tmp` path even under `--mode accept-edits`, which cancels that subagent; Print mode ignores hook `permissionOverrides` under decision `allow` and `ask`. 1.5.7 headless runs start in Auto mode unless `--mode` is given."
note_zh = "Gemini 4 Hydrogen（`gemini-4-hydrogen-low|medium|high|xhigh`）在 High 與 XHigh 時視為尖端主核，Low 與 Medium 會警告。Orchestrator (Carbon)（`gemini-pro-orchestrator`）與 Orchestrator (Argon)（`gemini-pro-orchestrator-argon`）視為尖端模型；兩者內部已分工規劃與執行，本外掛的子代理派工會疊加其上。Orchestrator (Carbon) 在 `exit_plan_mode` 後交給內部執行者，hook 收到的 `modelName` 是 `gemini-flash-worker-agy`，外掛接受且不發非尖端警告；實測中 Orchestrator (Argon) 全程維持自己的 id。`flash` 與 `flash_lite` 子代理層級由伺服器端解析，CLI 日誌與 hook payload 都看不到實際模型，`flash` 是否已改指 Hydrogen 尚未驗證。`agy models` 只在 ADC 登入時列出 Gemini 4 Carbon。agy 1.5.x 沒有列目錄、grep、glob、find 工具：偵察子代理只拿到 `read_file` 與 `send_message`，只讀指名路徑，需要搜尋時回報 BLOCKED。print 模式下，子代理寫入實際路徑不在 `/tmp` 下的檔案，即使有 `--mode accept-edits` 也會被軟拒絕，該子代理隨之取消；print 模式不理會 hook 的 `permissionOverrides`，`allow` 與 `ask` 都一樣。1.5.7 的 headless 執行若未指定 `--mode`，預設為 Auto mode。"
