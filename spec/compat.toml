[agy]
verified = "1.5.5"
verified_on = "2026-11-11"
method = "headless run with gemini-4-carbon-high as primary (ADC sign-in)"
method_zh = "以 gemini-4-carbon-high 為主核做 headless 實跑（ADC 登入）"
fixtures = "1.5.5"
note = "Gemini 4 Carbon (Low|Medium|High) is listed by `agy models` only under ADC sign-in; it is accepted as a frontier primary, the default stays Argon. agy 1.5.x changed the default toolset (no list, grep, glob or find tool): the scout receives only `read_file` and `send_message`, so it reads named paths and reports BLOCKED when a search is needed; searches and git checks go to the worker. Print mode ignores hook `permissionOverrides` under decision `allow` and `ask`. Headless writes need `--mode accept-edits` or a `write_file(<exact absolute path>)` rule, except under a real `/tmp` path."
note_zh = "`agy models` 只在 ADC 登入時列出 Gemini 4 Carbon (Low|Medium|High)，外掛視為尖端模型，預設仍為 Argon。agy 1.5.x 更換預設工具組（沒有列目錄、grep、glob、find 工具）：偵察子代理只拿到 `read_file` 與 `send_message`，只讀指名路徑，需要搜尋時回報 BLOCKED，搜尋與 git 檢查交給 worker。print 模式不理會 hook 的 `permissionOverrides`，`allow` 與 `ask` 都一樣。headless 寫檔要用 `--mode accept-edits` 或 `write_file(<完整絕對路徑>)` 規則，只有實際路徑在 `/tmp` 下例外。"
