# CLI versions this plugin release was last verified on. Read by scripts/sync-generated.py, which writes
# COMPAT into scripts/mitosis_generated.py and the table between the compat markers in both READMEs.
# Editing this file never changes doctor's exit code; doctor only prints an info row. `method_zh` and
# `note_zh` are the Traditional Chinese texts used by README.zh-TW.md.

[claude]
verified = "2.1.322"
verified_on = "2026-11-10"
method = "headless smoke and interactive background-agent run with claude-fable-5-2 as primary"
method_zh = "以 claude-fable-5-2 為主核實跑 headless smoke 與互動背景代理"
fixtures = "2.1.322"
note = "The Agent tool now lists `fork` and `web-fetch` as built-in types; both are left unpinned. `--model fable` resolves to `claude-fable-5-2`."
note_zh = "Agent 工具現在內建 `fork` 與 `web-fetch` 兩種類型，兩者都不釘定。`--model fable` 會解析為 `claude-fable-5-2`。"

[codex]
verified = "0.169.1"
verified_on = "2026-11-18"
method = "installed plugin run with gpt-6.2-sol as primary (scout and worker spawn) and gpt-6.2-astra as primary"
method_zh = "以 gpt-6.2-sol 為主核實跑已安裝外掛（派出偵察與執行子代理），並以 gpt-6.2-astra 為主核實跑"
fixtures = "0.169.1"
note = "GPT-6.2 ships only Astra (`gpt-6.2-astra`) and Sol (`gpt-6.2-sol`); both are frontier primaries and the default primary is now `gpt-6.2-sol`. There is no 6.2 Terra or Luna, so the worker stays on `gpt-6.1-terra` and the scout on `gpt-6-luna`. The 6.2 API rejects reasoning effort `none`; the plugin pins `low` and `medium` only. A child rollout records the parent model in its first `turn_context` and the pinned model in the last one, which is the one pin verification reads. `models_cache.json` written by an older Codex may not list the 6.2 models yet."
note_zh = "GPT-6.2 只有 Astra（`gpt-6.2-astra`）與 Sol（`gpt-6.2-sol`），兩者都視為尖端主核，預設主核改為 `gpt-6.2-sol`。6.2 沒有 Terra 與 Luna，執行子代理維持 `gpt-6.1-terra`、偵察子代理維持 `gpt-6-luna`。6.2 的 API 拒絕推理等級 `none`；本外掛只釘定 `low` 與 `medium`。子代理 rollout 的第一個 `turn_context` 記錄主核模型、最後一個記錄釘定模型，釘定驗證讀的是最後一個。舊版 Codex 寫下的 `models_cache.json` 可能還沒有列出 6.2 模型。"

[agy]
verified = "1.5.12"
verified_on = "2026-11-19"
method = "headless /orchestrate runs with gemini-4-neon-high and gemini-pro-orchestrator-neon as primary, plus harness-bench task 03 with the plugin installed (Neon High, filesystem-isolated)"
method_zh = "以 gemini-4-neon-high 與 gemini-pro-orchestrator-neon 為主核做 headless /orchestrate 實跑，並在安裝外掛的隔離環境以 Neon High 跑 harness-bench 第 03 題"
fixtures = "1.5.12"
note = "Gemini 4 Neon (`gemini-4-neon-low|medium|high|xhigh`, agy 1.5.11+) is a frontier primary at every level, like Carbon. Orchestrator (Neon) (`gemini-pro-orchestrator-neon`) plans with Neon and, as with Carbon, hands execution to `gemini-flash-worker-agy`. The default agy primary is now Gemini 4 Hydrogen (High). XHigh levels and Orchestrator primaries get a one-time cost advisory (`AGY_MITOSIS_PRIMARY_ADVICE=0` silences it); agy SessionStart payloads carry the live `modelName`, which the advisory prefers over settings.json. Gemini 4 Hydrogen (`gemini-4-hydrogen-low|medium|high|xhigh`) is a frontier primary at High and XHigh; Low and Medium are warned about. Orchestrator (Carbon) (`gemini-pro-orchestrator`) and Orchestrator (Argon) (`gemini-pro-orchestrator-argon`) are accepted; they already split planning and execution internally, so subagent dispatch stacks on top. After `exit_plan_mode`, Orchestrator (Carbon) hands execution to an internal executor that hook payloads report as `gemini-flash-worker-agy`, which is accepted without the non-frontier warning; Orchestrator (Argon) kept its own id in the verified run. The `flash` and `flash_lite` subagent tiers are resolved server side and neither the CLI log nor hook payloads show the concrete model, so whether `flash` now means Hydrogen is unverified. Gemini 4 Carbon is listed by `agy models` only under ADC sign-in. agy 1.5.x has no list, grep, glob or find tool: the scout receives only `read_file` and `send_message`, so it reads named paths and reports BLOCKED when a search is needed. Print mode soft-denies a subagent's file write outside a real `/tmp` path even under `--mode accept-edits`, which cancels that subagent; Print mode ignores hook `permissionOverrides` under decision `allow` and `ask`. 1.5.7 and later headless runs start in Auto mode unless `--mode` is given."
note_zh = "Gemini 4 Neon（`gemini-4-neon-low|medium|high|xhigh`，agy 1.5.11 以上）比照 Carbon，各等級都視為尖端主核。Orchestrator (Neon)（`gemini-pro-orchestrator-neon`）由 Neon 規劃，與 Carbon 相同，執行時交給 `gemini-flash-worker-agy`。agy 預設主核改為 Gemini 4 Hydrogen (High)。XHigh 等級與 Orchestrator 主核會收到一次成本提醒（`AGY_MITOSIS_PRIMARY_ADVICE=0` 關閉）；agy SessionStart payload 帶有當下的 `modelName`，提醒以它為準，不看 settings.json。Gemini 4 Hydrogen（`gemini-4-hydrogen-low|medium|high|xhigh`）在 High 與 XHigh 時視為尖端主核，Low 與 Medium 會警告。Orchestrator (Carbon)（`gemini-pro-orchestrator`）與 Orchestrator (Argon)（`gemini-pro-orchestrator-argon`）視為尖端模型；兩者內部已分工規劃與執行，本外掛的子代理派工會疊加其上。Orchestrator (Carbon) 在 `exit_plan_mode` 後交給內部執行者，hook 收到的 `modelName` 是 `gemini-flash-worker-agy`，外掛接受且不發非尖端警告；實測中 Orchestrator (Argon) 全程維持自己的 id。`flash` 與 `flash_lite` 子代理層級由伺服器端解析，CLI 日誌與 hook payload 都看不到實際模型，`flash` 是否已改指 Hydrogen 尚未驗證。`agy models` 只在 ADC 登入時列出 Gemini 4 Carbon。agy 1.5.x 沒有列目錄、grep、glob、find 工具：偵察子代理只拿到 `read_file` 與 `send_message`，只讀指名路徑，需要搜尋時回報 BLOCKED。print 模式下，子代理寫入實際路徑不在 `/tmp` 下的檔案，即使有 `--mode accept-edits` 也會被軟拒絕，該子代理隨之取消；print 模式不理會 hook 的 `permissionOverrides`，`allow` 與 `ask` 都一樣。1.5.7 以後的 headless 執行若未指定 `--mode`，預設為 Auto mode。"
