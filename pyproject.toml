# Tooling configuration only: the plugin is not a Python package and has no
# runtime dependencies. Hook scripts run on Python 3.8+; the test suite and
# scripts/setup-codex.py need 3.11+ (tomllib).
[project]
name = "mitosis-orchestrator"
version = "2.3.0"
description = "Frontier-primary multi-agent orchestration hooks for Antigravity, Claude Code and Codex CLI"
requires-python = ">=3.8"
license = "MIT"
dependencies = []

[tool.ruff]
target-version = "py38"
line-length = 160
extend-exclude = ["assets"]

[tool.ruff.lint]
# Correctness only: syntax errors, undefined names, unused imports and variables.
select = ["E9", "F"]
